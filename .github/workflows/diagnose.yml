name: Diagnose
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/fetch-bundled.js win32
      - run: npx electron-builder --win --dir --publish never
      - run: npm install --no-save playwright@1.48.2
      - run: node ci/diagnose.js "dist/win-unpacked/Echo Board.exe" diag
        timeout-minutes: 15
      - name: Save results to the diag-results branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd diag
          git init -q -b diag-results
          git config user.name "Echo Board CI"; git config user.email "noreply@github.com"
          git add -A && git commit -q -m "Diagnostics ${{ github.run_id }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" diag-results
